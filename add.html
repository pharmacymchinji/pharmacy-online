<!DOCTYPE html>
<html>
<head>
<style>
body { background:#f2f2f2; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; }
.box { background:white; padding:40px; border-radius:10px; box-shadow:0px 0px 15px #aaa; width:350px; text-align:center; }
h2 { font-size:32px; }
input, button { font-size:20px; width:90%; padding:10px; margin:10px 0; }
button { background:#2e86de; color:white; border:none; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
<h2>Add Medicine</h2>
<form method="POST">
<input name="type" placeholder="Medicine Type" required><br>
<input name="box_number" placeholder="Box Number" required><br>
<input name="quantity" type="number" placeholder="Quantity" required><br>
<input name="price" type="number" step="0.01" placeholder="Price" required><br>
<button>Add</button>
</form>
<br>
<a href="/dashboard" style="font-size:20px;">Back to Dashboard</a>
</div>
</body>
</html>
