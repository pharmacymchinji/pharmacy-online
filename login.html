<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #f2f2f2;
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.login-box {
  background: white;
  padding: 40px;
  border-radius: 10px;
  box-shadow: 0px 0px 15px #aaa;
  width: 350px;
  text-align: center;
}
h2 {
  font-size: 32px;
}
input, button {
  font-size: 20px;
  width: 90%;
  padding: 10px;
  margin: 10px 0px;
}
button {
  background: #2e86de;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover {
  background: #1e6ab8;
}
</style>
</head>
<body>
<div class="login-box">
<h2>Pharmacy Login</h2>
<form method="POST">
<input name="username" placeholder="Username" required><br>
<input name="password" type="password" placeholder="Password" required><br>
<button>Login</button>
</form>
</div>
</body>
</html>
